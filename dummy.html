<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Saham - Wallet</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="margin: 0;">🛠️ Mode Test Portfolio</h2>
            <a href="/" class="btn-outline" style="text-decoration: none; padding: 5px 10px; font-size: 0.8rem;">Kembali ke Utama</a>
        </div>

        <div class="total-container">
            <div style="color: var(--text-muted); font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">Total Balance (Cash + Stocks)</div>
            <div class="total-amount" id="total-balance">Rp 0</div>
        </div>

        <div class="form-card" style="margin-bottom: 1.5rem;">
            <h3 style="margin-top: 0; font-size: 0.95rem; color: var(--text-muted);">Add Saham</h3>
            <form id="stock-form" style="display: flex; gap: 10px;">
                <input type="text" id="stock-ticker" placeholder="Kode (misal: BBCA)" required style="width: 40%; text-transform: uppercase;">
                <input type="number" id="stock-lot" placeholder="Jml Lot" required min="1" style="width: 30%;">
                <button type="submit" class="btn-primary" style="width: 30%;">Add</button>
            </form>
        </div>

        <div class="portfolio-card" style="background: var(--bg-container); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.8rem;">
                <h3 style="margin: 0; font-size: 0.95rem; font-weight: 600;">My Portfolio</h3>
                <span id="stock-sync-status" style="font-size: 0.75rem; color: var(--text-muted);">Fetching data...</span>
            </div>
            
            <ul id="portfolio-list" style="list-style: none; padding: 0; margin: 0;"></ul>
            
            <div style="text-align: right; margin-top: 10px; font-size: 0.85rem; font-weight: 600;">
                Total Asset Saham: <span id="total-stock-value" style="color: var(--success);">Rp 0</span>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfEM_BCzUpBHtzx2LPvGDXiZ44g-NTyLY",
            authDomain: "wallet.randomhub.online",
            projectId: "wallet-4da85",
            storageBucket: "wallet-4da85.firebasestorage.app",
            messagingSenderId: "824717163561",
            appId: "1:824717163561:web:f6ea7c049a4d5a5c677038"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentCashTotal = 0;  
        let currentStockTotal = 0; 
        let myStocks = []; 

        function updateGrandTotal() {
            const grandTotal = currentCashTotal + currentStockTotal;
            const balanceEl = document.getElementById('total-balance');
            if (balanceEl) balanceEl.innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
        }

        // AMBIL DATA CASH DARI DATABASE UTAMA (Hanya baca totalnya)
        function loadCashData(uid) {
            db.collection('users').doc(uid).collection('transactions')
              .onSnapshot(snapshot => {
                  currentCashTotal = 0; 
                  snapshot.forEach(doc => {
                      const data = doc.data();
                      if (data.type === 'income') currentCashTotal += Number(data.amount);
                      else currentCashTotal -= Number(data.amount);
                  });
                  updateGrandTotal();
              });
        }

        // AMBIL DAFTAR SAHAM
        function loadPortfolio(uid) {
            db.collection('users').doc(uid).collection('portfolio')
              .orderBy('createdAt', 'asc')
              .onSnapshot(snapshot => {
                  myStocks = [];
                  snapshot.forEach(doc => {
                      myStocks.push({ id: doc.id, ...doc.data() });
                  });
                  fetchStockPrices();
              });
        }

        // CARI HARGA KE YAHOO FINANCE
        async function fetchStockPrices() {
            const list = document.getElementById('portfolio-list');
            const syncStatus = document.getElementById('stock-sync-status');
            if (!list) return;
            
            if(syncStatus) syncStatus.innerText = 'Syncing...';
            list.innerHTML = '';
            currentStockTotal = 0;

            for (const stock of myStocks) {
                const ticker = stock.ticker.toUpperCase();
                const lots = Number(stock.lots);
                const shares = lots * 100;
                let price = 0;
                let totalValue = 0;
                let isError = false;

                try {
                    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}.JK`;
                    // Proxy diganti ke corsproxy.io yang lebih kebal limit
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                    
                    const res = await fetch(proxyUrl);
                    
                    // Cek kalau proxy nolak
                    if (!res.ok) throw new Error("Gagal nembus proxy");
                    
                    const parsed = await res.json();
                    
                    price = parsed.chart.result[0].meta.regularMarketPrice;
                    totalValue = price * shares;
                } catch (e) {
                    console.error(`Gagal narik harga ${ticker}:`, e);
                    isError = true;
                }

                currentStockTotal += totalValue;

                list.innerHTML += `
                    <li style="display: flex; justify-content: space-between; padding: 0.8rem 0; border-bottom: 1px solid var(--border-color);">
                        <div>
                            <div style="font-weight: 700;">${ticker}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${lots} Lot</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 600;">${isError ? 'N/A' : `Rp ${price.toLocaleString('id-ID')} / lb`}</div>
                            <div style="font-size: 0.85rem; color: var(--success); font-weight: 600;">Rp ${totalValue.toLocaleString('id-ID')}</div>
                            <button class="delete-btn" onclick="deleteStock('${stock.id}')" style="margin-top: 5px;">Hapus</button>
                        </div>
                    </li>
                `;
            }

            if(syncStatus) {
                syncStatus.innerText = '● Live';
                syncStatus.style.color = 'var(--success)';
            }
            const totalEl = document.getElementById('total-stock-value');
            if (totalEl) totalEl.innerText = `Rp ${currentStockTotal.toLocaleString('id-ID')}`;
            
            updateGrandTotal();
        }

        // TAMBAH SAHAM BARU
        const stockForm = document.getElementById('stock-form');
        if (stockForm) {
            stockForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const user = auth.currentUser;
                if (!user) return;

                const ticker = document.getElementById('stock-ticker').value.toUpperCase().trim();
                const lots = document.getElementById('stock-lot').value;

                db.collection('users').doc(user.uid).collection('portfolio').add({
                    ticker: ticker,
                    lots: Number(lots),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    stockForm.reset();
                }).catch(err => alert("Gagal nambah saham: " + err.message));
            });
        }

        // HAPUS SAHAM
        window.deleteStock = function(id) {
            const user = auth.currentUser;
            if (user) {
                db.collection('users').doc(user.uid).collection('portfolio').doc(id).delete();
            }
        };

        // OTENTIKASI & JALANKAN AWAL
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = '/login';
            } else {
                loadCashData(user.uid);
                loadPortfolio(user.uid);
            }
        });

        // AUTO SYNC TIAP 1 MENIT
        setInterval(() => {
            if (myStocks.length > 0) fetchStockPrices();
        }, 60000);
    </script>
</body>
</html>
