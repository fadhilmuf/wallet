<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Wallet</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <div class="header-bar">
            <div>
                <h2 id="user-greeting" style="margin: 0; font-weight: 700; font-size: 1.5rem;">Hello!</h2>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-btn"></button>
                <button onclick="logout()" class="btn-outline" style="height: 38px; padding: 0 1rem; font-size: 0.8rem;">Logout</button>
            </div>
        </div>

        <div class="total-container" style="margin-bottom: 0.5rem;">
            <!-- GRAND TOTAL (OVERVIEW) -->
            <div style="color: var(--text-muted); font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">
                Net Balance (Overview)
                <button id="balance-toggle" class="balance-toggle-btn" title="Show/hide balance"></button>
            </div>
            <div class="total-amount" id="total-balance" style="margin-bottom: 1.2rem;">Rp 0</div>

            <!-- GRID DUA SALDO: CASH & PAYLATER -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">
                <div>
                    <div style="color: var(--text-muted); font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Cash / Bank</div>
                    <div class="total-amount" id="cash-balance" style="font-size: 1.2rem;">Rp 0</div>
                </div>
                <div>
                    <div style="color: var(--text-muted); font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem;">Paylater Due</div>
                    <div class="total-amount" id="paylater-balance" style="font-size: 1.2rem; color: var(--danger);">Rp 0</div>
                </div>
            </div>
            
            <div style="display: flex; gap: 1.2rem; font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">
                <div>Today: <span id="spend-today" style="color: var(--text-main); font-weight: 700;">Rp 0</span></div>
                <div>Week: <span id="spend-week" style="color: var(--text-main); font-weight: 700;">Rp 0</span></div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 1rem;">
            <div class="indicator-dots" style="margin-bottom: 0;">
                <div class="dot active" id="dot-1" style="cursor: pointer;" onclick="goToSlide(0)"></div>
                <div class="dot" id="dot-2" style="cursor: pointer;" onclick="goToSlide(1)"></div>
            </div>
        </div>

        <div class="carousel-wrapper" id="swipe-area">
            
            <!-- SLIDE 1: ADD TRANSACTION FORM -->
            <div class="carousel-item">
                <div class="form-card" style="margin-bottom: 0;">
                    <form id="expense-form">
                        
                        <!-- TAMBAHAN TOMBOL PAY BILL -->
                        <div class="form-group">
                            <label>Transaction Type</label>
                            <div class="type-toggle">
                                <button type="button" class="type-btn" data-type="income">Income</button>
                                <button type="button" class="type-btn active" data-type="expense">Expense</button>
                                <button type="button" class="type-btn" data-type="pay_bill">Pay Bill</button>
                            </div>
                            <input type="hidden" id="type" value="expense">
                        </div>

                        <!-- PAYMENT METHOD -->
                        <div class="form-group" id="method-group">
                            <label>Payment Method</label>
                            <div class="type-toggle">
                                <button type="button" class="method-btn active" data-method="cash">Cash / Bank</button>
                                <button type="button" class="method-btn" data-method="paylater">Paylater</button>
                            </div>
                            <input type="hidden" id="method" value="cash">
                        </div>

                        <div class="form-group">
                            <label for="desc">Description (Optional)</label>
                            <input type="text" id="desc" placeholder="E.g., Monthly salary / Coffee">
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount (Rp)</label>
                            <input type="number" id="amount" required min="1" placeholder="E.g., 50000">
                        </div>
                        <button type="submit" class="btn-primary">Add Transaction</button>
                    </form>
                </div>
            </div>

            <!-- SLIDE 2: DONUT CHART OVERVIEW -->
            <div class="carousel-item">
                <div class="form-card" style="margin-bottom: 0; padding: 1.25rem 1rem; height: 100%; box-sizing: border-box; display: flex; flex-direction: column;">
                    <div class="chart-header">
                        <h3 class="chart-title">Overview</h3>
                        <select id="month-filter" class="month-select"></select>
                    </div>
                    
                    <div class="overview-content">
                        <!-- INCOME TEXT -->
                        <div class="stat-item income-stat">
                            <div class="stat-header">
                                <span class="legend-dot" style="background: var(--success);"></span>
                                <span class="stat-label">Income</span>
                                <span class="stat-pct" id="stat-inc-pct">0%</span>
                            </div>
                            <div class="stat-val text-success" id="stat-inc-val">Rp 0</div>
                        </div>

                        <!-- CENTER DONUT -->
                        <div class="donut-container">
                            <canvas id="expenseChart"></canvas>
                        </div>

                        <!-- EXPENSE TEXT -->
                        <div class="stat-item expense-stat">
                            <div class="stat-header" style="flex-direction: row-reverse;">
                                <span class="legend-dot" style="background: var(--danger);"></span>
                                <span class="stat-label">Expense</span>
                                <span class="stat-pct" id="stat-exp-pct">0%</span>
                            </div>
                            <div class="stat-val text-danger" id="stat-exp-val">Rp 0</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <!-- RECENT TRANSACTIONS -->
        <div class="tx-header">
            <h3 class="tx-title">Recent Transactions</h3>
            <button id="export-btn" class="btn-export">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: -1px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export CSV
            </button>
        </div>
        <ul class="expense-list" id="expense-list"></ul>
        
        <div style="margin-top: 3rem; text-align: center; padding-bottom: 1rem;">
            <a href="/privacy.html" style="color: var(--text-muted); text-decoration: underline; font-size: 0.85rem; font-weight: 500;">Privacy Policy</a>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
